<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Violí &amp; Cant Solista — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-top">
      <div class="lang-switcher" role="group" aria-label="Idioma / Llengua">
        <button type="button" class="lang-btn active" data-lang="ca" aria-pressed="true">CA</button>
        <span class="lang-sep" aria-hidden="true">/</span>
        <button type="button" class="lang-btn" data-lang="es" aria-pressed="false">ES</button>
      </div>
    </div>

    <div class="container header-inner">
      <p id="artist-tagline" class="eyebrow"></p>
      <h1 id="artist-name" class="site-title"></h1>
      <div class="ornament" aria-hidden="true"><span></span></div>
      <p id="artist-location" class="subtitle-meta"></p>
    </div>

    <nav class="tabs-nav" aria-label="Navegació principal">
      <div class="container tabs-list" role="tablist">
        <button class="tab-btn active" role="tab" aria-selected="true" aria-controls="panel-presentacio" id="tab-presentacio" data-tab="presentacio"></button>
        <button class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-serveis" id="tab-serveis" data-tab="serveis"></button>
        <button class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-galeria" id="tab-galeria" data-tab="galeria"></button>
      </div>
    </nav>
  </header>

  <main class="container main-content">
    <div id="load-error" class="error-banner" hidden></div>

    <!-- PESTAÑA 1: PRESENTACIÓ -->
    <section id="panel-presentacio" class="tab-panel active" role="tabpanel" aria-labelledby="tab-presentacio">
      <div class="intro-block">
        <h2 id="pres-headline" class="section-heading"></h2>
        <div id="pres-paragraphs" class="prose-block"></div>
      </div>

      <div id="pres-pillars" class="pillars-grid"></div>

      <div id="pres-cv" class="cv-grid"></div>

      <div class="cta-box">
        <p id="pres-cta-text"></p>
        <a href="#contacte" id="pres-cta-btn" class="btn-primary"></a>
      </div>
    </section>

    <!-- PESTAÑA 2: SERVEIS I TARIFES -->
    <section id="panel-serveis" class="tab-panel" role="tabpanel" aria-labelledby="tab-serveis" hidden>
      <div class="section-header">
        <h2 id="serv-title" class="section-heading"></h2>
        <p id="serv-subtitle" class="section-lead"></p>
      </div>

      <div class="modifier-box">
        <span id="serv-modifier-label" class="modifier-label"></span>
        <div id="serv-modifiers" class="modifier-pills" role="group"></div>
        <p id="serv-modifier-note" class="modifier-note"></p>
      </div>

      <div id="serv-events" class="events-grid"></div>

      <p id="serv-disclaimer" class="disclaimer-text"></p>
    </section>

    <!-- PESTAÑA 3: GALERIA -->
    <section id="panel-galeria" class="tab-panel" role="tabpanel" aria-labelledby="tab-galeria" hidden>
      <div class="section-header">
        <h2 id="gal-title" class="section-heading"></h2>
        <p id="gal-subtitle" class="section-lead"></p>
      </div>

      <div id="gal-filters" class="filter-pills"></div>
      <div id="gal-videos" class="videos-grid"></div>
    </section>
  </main>

  <footer id="contacte" class="site-footer">
    <div class="container footer-inner">
      <h2 id="footer-title" class="footer-heading"></h2>
      <p id="footer-subtitle" class="footer-sub"></p>
      <div id="footer-links" class="contact-links"></div>
      <p id="footer-copy" class="copyright"></p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
