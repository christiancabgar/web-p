<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paula G. Balbín | Violí, Veu &amp; Agrupacions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ambient-glow" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <a href="#presentacio" class="brand-name" id="brand-name">Paula G. Balbín</a>
        <span class="brand-subtitle" id="brand-subtitle">Violí · Cant · Agrupacions</span>
      </div>

      <div class="header-controls">
        <nav class="main-nav" aria-label="Navegació principal" id="main-nav">
          <button class="nav-tab active" data-tab="presentacio" id="tab-btn-presentacio">Presentació</button>
          <button class="nav-tab" data-tab="serveis" id="tab-btn-serveis">Serveis i Tarifes</button>
          <button class="nav-tab" data-tab="galeria" id="tab-btn-galeria">Galeria</button>
        </nav>

        <div class="lang-switcher" role="group" aria-label="Selector d'idioma">
          <button class="lang-btn active" data-lang="ca">CA</button>
          <span class="lang-sep">/</span>
          <button class="lang-btn" data-lang="es">ES</button>
          <span class="lang-sep">/</span>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container main-content">
    <div id="status-banner" class="status-banner hidden" role="alert"></div>

    <!-- PESTAÑA 1: PRESENTACIÓN / TRAYECTORIA -->
    <section id="panel-presentacio" class="tab-panel active" aria-labelledby="tab-btn-presentacio">
      <div class="bio-layout">
        <aside class="bio-sidebar">
          <div class="portrait-frame">
            <img id="bio-image" src="" alt="" />
            <div class="portrait-placeholder" id="bio-image-fallback">
              <span>Fotografia d'estudi / directe</span>
            </div>
          </div>
          <ul class="specialties-list" id="bio-specialties"></ul>
        </aside>

        <article class="bio-editorial">
          <p class="eyebrow" id="bio-eyebrow"></p>
          <h1 class="section-title" id="bio-title"></h1>
          <div class="gold-divider"></div>
          <div class="bio-paragraphs" id="bio-paragraphs"></div>
        </article>
      </div>
    </section>

    <!-- PESTAÑA 2: SERVICIOS Y PRECIOS (EVENTO + MODIFICADOR DE GAMA) -->
    <section id="panel-serveis" class="tab-panel" aria-labelledby="tab-btn-serveis">
      <div class="section-header-centered">
        <p class="eyebrow" id="services-eyebrow"></p>
        <h2 class="section-title" id="services-title"></h2>
        <p class="section-intro" id="services-intro"></p>
      </div>

      <!-- Selector de Tipo de Evento -->
      <div class="event-selector" role="tablist" id="event-selector"></div>

      <!-- Descripción del Evento seleccionado -->
      <div class="event-context" id="event-context">
        <h3 class="event-context-title" id="event-context-title"></h3>
        <p class="event-context-desc" id="event-context-desc"></p>
      </div>

      <!-- Tarjetas de Gamas / Packs para el Evento seleccionado -->
      <div class="packs-grid" id="packs-grid"></div>

      <p class="services-footnote" id="services-footnote"></p>
    </section>

    <!-- PESTAÑA 3: GALERÍA MULTIMEDIA -->
    <section id="panel-galeria" class="tab-panel" aria-labelledby="tab-btn-galeria">
      <div class="section-header-centered">
        <p class="eyebrow" id="gallery-eyebrow"></p>
        <h2 class="section-title" id="gallery-title"></h2>
        <p class="section-intro" id="gallery-intro"></p>
      </div>

      <div class="gallery-grid" id="gallery-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-heading">
        <h2 class="footer-title" id="footer-title">Contacte i contractació</h2>
        <p class="footer-subtitle" id="footer-subtitle"></p>
      </div>

      <div class="contact-links">
        <a id="link-whatsapp" href="#" target="_blank" rel="noopener noreferrer" class="contact-pill">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          </svg>
          <span id="label-whatsapp">WhatsApp</span>
        </a>

        <a id="link-instagram" href="#" target="_blank" rel="noopener noreferrer" class="contact-pill">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
          </svg>
          <span id="label-instagram">Instagram</span>
        </a>

        <a id="link-email" href="#" class="contact-pill">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <span id="label-email">Correu electrònic</span>
        </a>
      </div>

      <p class="footer-copy" id="footer-copy"></p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
